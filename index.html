<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浸透圧・細胞膨圧シミュレーション</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-950 text-teal-100 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6">
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-teal-200 mb-1">🧬 浸透圧・細胞膨圧シミュレーション</h1>
    <p class="text-teal-500 text-xs">半透膜を通じた水分子の移動を視覚化</p>
  </header>

  <canvas id="canvas" width="740" height="400" class="w-full rounded-xl border border-teal-800 block mb-4" aria-label="浸透圧シミュレーション"></canvas>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div class="bg-teal-900 rounded-xl p-4">
      <label for="innerConc" class="block text-sm text-teal-300 mb-2">細胞内溶質濃度: <span id="valInner" class="text-white font-bold">0.3</span> mol/L</label>
      <input id="innerConc" type="range" min="0.0" max="1.0" step="0.05" value="0.3" class="w-full accent-teal-400" aria-label="細胞内溶質濃度" oninput="onParamChange()">
    </div>
    <div class="bg-teal-900 rounded-xl p-4">
      <label for="outerConc" class="block text-sm text-teal-300 mb-2">外部溶液濃度: <span id="valOuter" class="text-white font-bold">0.3</span> mol/L</label>
      <input id="outerConc" type="range" min="0.0" max="1.0" step="0.05" value="0.3" class="w-full accent-teal-400" aria-label="外部溶液濃度" oninput="onParamChange()">
    </div>
  </div>

  <div class="grid grid-cols-3 gap-2 mb-4">
    <button onclick="setPreset('hypo')" class="bg-blue-800 hover:bg-blue-700 text-blue-200 text-xs py-2 rounded-lg transition" aria-label="低張液プリセット">💧 低張液<br><span class="text-blue-400">外部 &lt; 細胞内</span></button>
    <button onclick="setPreset('iso')" class="bg-teal-800 hover:bg-teal-700 text-teal-200 text-xs py-2 rounded-lg transition" aria-label="等張液プリセット">⚖️ 等張液<br><span class="text-teal-400">外部 = 細胞内</span></button>
    <button onclick="setPreset('hyper')" class="bg-orange-900 hover:bg-orange-800 text-orange-200 text-xs py-2 rounded-lg transition" aria-label="高張液プリセット">🔥 高張液<br><span class="text-orange-400">外部 &gt; 細胞内</span></button>
  </div>

  <div id="statusPanel" class="bg-teal-900 border border-teal-700 rounded-xl p-4 mb-4 grid grid-cols-3 gap-3 text-center">
    <div>
      <div class="text-xs text-teal-500 mb-1">状態</div>
      <div id="stateLabel" class="font-bold text-sm text-teal-200"></div>
    </div>
    <div>
      <div class="text-xs text-teal-500 mb-1">水分子の移動</div>
      <div id="flowLabel" class="font-bold text-sm text-teal-200"></div>
    </div>
    <div>
      <div class="text-xs text-teal-500 mb-1">浸透圧差</div>
      <div id="pressLabel" class="font-bold text-sm text-teal-200"></div>
    </div>
  </div>

  <div class="bg-teal-900 border border-teal-800 rounded-xl p-4 text-xs text-teal-400">
    <div class="font-bold text-teal-200 mb-1">浸透圧とは</div>
    <p>半透膜（水分子は通過できるが溶質は通過できない膜）を挟んで濃度差がある場合、水は濃度の低い方から高い方へ移動する。この移動を止めるために必要な圧力が浸透圧（π=iMRT）。植物の膨圧はこの原理で細胞壁を押し広げ、植物を支える。</p>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let particles = [];
let time = 0;
let animReq = null;
let cellRadius = 90;
let targetCellRadius = 90;
const BASE_RADIUS = 90;
const MAX_RADIUS = 115;
const MIN_RADIUS = 65;

function onParamChange() {
  const inner = parseFloat(document.getElementById('innerConc').value);
  const outer = parseFloat(document.getElementById('outerConc').value);
  document.getElementById('valInner').textContent = inner.toFixed(2);
  document.getElementById('valOuter').textContent = outer.toFixed(2);
  updateStatus(inner, outer);
  initParticles(inner, outer);
}

function updateStatus(inner, outer) {
  const diff = inner - outer;
  let state, flow, pressure;
  if (Math.abs(diff) < 0.03) {
    state = '等張 (Isotonic)';
    flow = '均衡 (net=0)';
    pressure = '0 atm';
    document.getElementById('stateLabel').className = 'font-bold text-sm text-teal-300';
    document.getElementById('flowLabel').className = 'font-bold text-sm text-teal-300';
  } else if (outer < inner) {
    state = '低張 (Hypotonic)';
    flow = '→ 細胞内へ流入';
    pressure = '+' + (diff * 24.4).toFixed(1) + ' atm';
    document.getElementById('stateLabel').className = 'font-bold text-sm text-blue-300';
    document.getElementById('flowLabel').className = 'font-bold text-sm text-blue-300';
  } else {
    state = '高張 (Hypertonic)';
    flow = '← 細胞外へ流出';
    pressure = '-' + (Math.abs(diff) * 24.4).toFixed(1) + ' atm';
    document.getElementById('stateLabel').className = 'font-bold text-sm text-orange-300';
    document.getElementById('flowLabel').className = 'font-bold text-sm text-orange-300';
  }
  document.getElementById('stateLabel').textContent = state;
  document.getElementById('flowLabel').textContent = flow;
  document.getElementById('pressLabel').textContent = pressure;

  // Update target cell size
  const diff2 = inner - outer;
  targetCellRadius = BASE_RADIUS + diff2 * 60;
  targetCellRadius = Math.max(MIN_RADIUS, Math.min(MAX_RADIUS, targetCellRadius));
}

function setPreset(type) {
  if (type === 'hypo') {
    document.getElementById('innerConc').value = 0.5;
    document.getElementById('outerConc').value = 0.1;
  } else if (type === 'iso') {
    document.getElementById('innerConc').value = 0.3;
    document.getElementById('outerConc').value = 0.3;
  } else {
    document.getElementById('innerConc').value = 0.1;
    document.getElementById('outerConc').value = 0.7;
  }
  onParamChange();
}

function initParticles(inner, outer) {
  particles = [];
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const r = cellRadius;

  // Water molecules (blue dots)
  // Inside cell
  const innerWater = Math.round(60 * (1 - inner));
  for (let i = 0; i < innerWater; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (r - 15);
    particles.push({
      x: cx + dist * Math.cos(angle),
      y: cy + dist * Math.sin(angle),
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      type: 'water', inside: true,
      size: 3
    });
  }
  // Outside cell
  const outerWater = Math.round(80 * (1 - outer));
  for (let i = 0; i < outerWater; i++) {
    let x, y;
    do {
      x = cx + (Math.random() - 0.5) * (W - 20);
      y = cy + (Math.random() - 0.5) * (H - 20);
    } while (Math.sqrt((x-cx)**2 + (y-cy)**2) < r + 10);
    particles.push({ x, y, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, type: 'water', inside: false, size: 3 });
  }

  // Solute molecules (colored)
  const innerSolute = Math.round(inner * 50);
  for (let i = 0; i < innerSolute; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (r - 20);
    particles.push({ x: cx + dist * Math.cos(angle), y: cy + dist * Math.sin(angle), vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, type: 'solute', inside: true, size: 5 });
  }
  const outerSolute = Math.round(outer * 60);
  for (let i = 0; i < outerSolute; i++) {
    let x, y;
    do {
      x = cx + (Math.random() - 0.5) * (W - 20);
      y = cy + (Math.random() - 0.5) * (H - 20);
    } while (Math.sqrt((x-cx)**2 + (y-cy)**2) < r + 10 || x < 10 || x > W-10 || y < 10 || y > H-10);
    particles.push({ x, y, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, type: 'solute', inside: false, size: 5 });
  }
}

function update() {
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const inner = parseFloat(document.getElementById('innerConc').value);
  const outer = parseFloat(document.getElementById('outerConc').value);

  // Animate cell size
  cellRadius += (targetCellRadius - cellRadius) * 0.03;

  // Update particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    const dist = Math.sqrt((p.x - cx)**2 + (p.y - cy)**2);
    const isInsideNow = dist < cellRadius;

    if (p.type === 'solute') {
      // Solutes can't cross membrane - reflect
      if (p.inside && dist > cellRadius - 5) {
        const nx = (p.x - cx) / dist;
        const ny = (p.y - cy) / dist;
        p.vx -= 2 * (p.vx * nx + p.vy * ny) * nx;
        p.vy -= 2 * (p.vx * nx + p.vy * ny) * ny;
        p.x = cx + (cellRadius - 6) * (p.x - cx) / dist;
        p.y = cy + (cellRadius - 6) * (p.y - cy) / dist;
      } else if (!p.inside && dist < cellRadius + 5) {
        const nx = (p.x - cx) / dist;
        const ny = (p.y - cy) / dist;
        p.vx += nx * 0.5;
        p.vy += ny * 0.5;
      }
    } else {
      // Water can cross membrane based on concentration gradient
      const crossProb = 0.002;
      if (p.inside && dist > cellRadius - 3) {
        // Try to exit if outer < inner (would go out if outer > inner)
        if (outer > inner && Math.random() < crossProb * (outer - inner) * 20) {
          p.inside = false;
        } else {
          // Reflect
          const nx = (p.x - cx) / dist;
          const ny = (p.y - cy) / dist;
          const dot = p.vx * nx + p.vy * ny;
          if (dot > 0) { p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny; }
        }
      } else if (!p.inside && dist < cellRadius + 3) {
        if (inner > outer && Math.random() < crossProb * (inner - outer) * 20) {
          p.inside = true;
        } else {
          const nx = (p.x - cx) / dist;
          const ny = (p.y - cy) / dist;
          const dot = p.vx * nx + p.vy * ny;
          if (dot < 0) { p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny; }
        }
      }
    }

    // Boundary
    if (p.x < 5 || p.x > W - 5) p.vx *= -1;
    if (p.y < 5 || p.y > H - 5) p.vy *= -1;
    p.x = Math.max(5, Math.min(W - 5, p.x));
    p.y = Math.max(5, Math.min(H - 5, p.y));

    // Random nudge
    if (Math.random() < 0.05) { p.vx += (Math.random() - 0.5) * 0.3; p.vy += (Math.random() - 0.5) * 0.3; }
    // Speed limit
    const spd = Math.sqrt(p.vx**2 + p.vy**2);
    if (spd > 2) { p.vx = p.vx / spd * 2; p.vy = p.vy / spd * 2; }
  });
}

function draw() {
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const inner = parseFloat(document.getElementById('innerConc').value);
  const outer = parseFloat(document.getElementById('outerConc').value);

  // Background
  const bgAlpha = Math.min(0.6, outer * 0.8);
  ctx.fillStyle = '#0d2a2a';
  ctx.fillRect(0, 0, W, H);

  // Outer solution tint
  ctx.fillStyle = `rgba(20, 184, 166, ${outer * 0.15})`;
  ctx.fillRect(0, 0, W, H);

  // Cell interior
  const innerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cellRadius);
  innerGrad.addColorStop(0, `rgba(16,185,129,${0.1 + inner * 0.1})`);
  innerGrad.addColorStop(1, `rgba(5,150,105,${0.05 + inner * 0.05})`);
  ctx.beginPath();
  ctx.arc(cx, cy, cellRadius, 0, Math.PI * 2);
  ctx.fillStyle = innerGrad;
  ctx.fill();

  // Cell membrane (semi-permeable)
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.arc(cx, cy, cellRadius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Particles
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    if (p.type === 'water') {
      ctx.fillStyle = p.inside ? 'rgba(96,165,250,0.8)' : 'rgba(147,197,253,0.6)';
    } else {
      ctx.fillStyle = p.inside ? 'rgba(251,146,60,0.9)' : 'rgba(248,113,113,0.8)';
    }
    ctx.fill();
  });

  // Labels
  ctx.fillStyle = 'rgba(52,211,153,0.8)';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('細胞内 ' + inner.toFixed(2) + ' mol/L', cx, cy + cellRadius + 20);
  ctx.fillText('外部溶液 ' + outer.toFixed(2) + ' mol/L', cx, H - 10);

  // Legend
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(96,165,250,0.8)';
  ctx.fillRect(8, H - 50, 8, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('水分子 (H₂O)', 20, H - 43);
  ctx.fillStyle = 'rgba(251,146,60,0.9)';
  ctx.fillRect(8, H - 36, 10, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('溶質 (通過不可)', 22, H - 27);

  // Dashed membrane label
  ctx.setLineDash([4, 2]);
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 1;
  const lx = cx + cellRadius + 15;
  ctx.beginPath(); ctx.moveTo(lx, cy - 20); ctx.lineTo(lx + 30, cy - 20); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.textAlign = 'left';
  ctx.fillText('半透膜', lx + 32, cy - 16);

  update();
  time++;
  animReq = requestAnimationFrame(draw);
}

window.onload = () => {
  onParamChange();
  draw();
};
</script>
</body>
</html>
